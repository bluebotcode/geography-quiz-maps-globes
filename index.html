<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geography Study Quiz — Maps & Globes</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: #eef5f0;
    margin: 0;
    padding: 16px;
    color: #223;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #4B0082;
    font-size: 1.6em;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #557;
    font-size: 1em;
    margin-bottom: 16px;
  }
  #scoreBar {
    position: sticky;
    top: 0;
    background: #4B0082;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 10;
  }
  .question {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .qnum {
    font-size: 0.85em;
    color: #888;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .qtext {
    font-size: 1.15em;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    padding: 12px 14px;
    border: 2px solid #ccd;
    border-radius: 8px;
    background: #fafcff;
    cursor: pointer;
    font-size: 1.05em;
    transition: background 0.15s, border-color 0.15s;
  }
  .option:hover {
    background: #eef4ff;
  }
  .option.correct {
    background: #d7f4dd;
    border-color: #2e9e4f;
    font-weight: bold;
  }
  .option.incorrect {
    background: #fbdada;
    border-color: #c0392b;
  }
  .option.disabled {
    pointer-events: none;
  }
  .feedback {
    margin-top: 10px;
    font-weight: bold;
    font-size: 1.05em;
  }
  .feedback.correct-text { color: #218838; }
  .feedback.wrong-text { color: #c0392b; }
  .answer-reveal {
    margin-top: 8px;
    padding: 10px;
    background: #fff3d6;
    border-left: 4px solid #e0a800;
    border-radius: 4px;
    font-size: 0.98em;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 1.05em;
    border: 2px solid #ccd;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  input[type="text"]:disabled {
    background: #f0f0f0;
  }
  button.check-btn {
    background: #4B0082;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1em;
    border-radius: 8px;
    cursor: pointer;
  }
  button.check-btn:disabled {
    background: #aaa;
    cursor: default;
  }
  .compare-box {
    margin-top: 10px;
    padding: 10px;
    background: #eef2f7;
    border-left: 4px solid #6c8ebf;
    border-radius: 4px;
    font-size: 0.98em;
  }
  #resetBtn {
    display: block;
    margin: 24px auto 40px auto;
    background: #c0392b;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 1.1em;
    border-radius: 10px;
    cursor: pointer;
  }
  #resetBtn:hover { background: #a5301f; }
  #topBar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  #resetBtnTop {
    background: #c0392b;
    color: white;
    border: none;
    padding: 10px 22px;
    font-size: 1em;
    border-radius: 10px;
    cursor: pointer;
  }
  #shareBtn {
    background: #4B0082;
    color: white;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #shareBtn svg { width: 20px; height: 20px; }
  #shareToast {
    display: none;
    text-align: center;
    font-size: 0.9em;
    color: #4B0082;
    margin-top: -8px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Geography Study Quiz</h1>
  <div class="subtitle">Ch. 1 — Maps, Globes, Latitude/Longitude, Map Types</div>
  <div id="topBar">
    <button id="resetBtnTop">Reset Quiz</button>
    <button id="shareBtn" title="Share this quiz" aria-label="Share this quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
  </div>
  <div id="shareToast">Link copied to clipboard!</div>
  <div id="scoreBar">Score: 0 / 30</div>
  <div id="quiz"></div>
  <button id="resetBtn">Reset Quiz</button>
</div>

<script>
const questions = [
  { type:"mc", q:"What is a globe?", options:["A flat drawing of Earth","A three-dimensional, spherical model of Earth","A type of map legend","A line of latitude"], correct:1 },
  { type:"mc", q:"What is a map?", options:["A two-dimensional, flat representation of Earth","A spherical model of Earth","A compass","A satellite photo only"], correct:0 },
  { type:"sa", q:"Why isn't a globe practical for finding your way to a friend's house?", answer:"It would have to be too big to carry around and still show enough detail.", alts:["too big","not portable","would need to be huge to see small areas","too big to carry"] },
  { type:"mc", q:"On a map, what does the title tell you?", options:["The distance scale","The subject of the map","The direction north","The map's legend"], correct:1 },
  { type:"sa", q:"What do symbols on a map represent?", answer:"Information such as natural resources and economic activities.", alts:["resources and activities","things like industries or products","natural resources and economic activities"] },
  { type:"mc", q:"What are labels on a map?", options:["Colors showing elevation","The names of places like cities, countries, rivers, and mountains","Lines of latitude","The map's scale"], correct:1 },
  { type:"sa", q:"What does the color blue usually represent on a map?", answer:"Water", alts:["oceans and lakes","bodies of water","oceans, lakes, rivers"] },
  { type:"mc", q:"What is a map legend (or key) used for?", options:["Showing directions","Explaining what the symbols and colors on a map mean","Showing the title","Measuring distance"], correct:1 },
  { type:"mc", q:"What does a compass rose show?", options:["Elevation levels","The four directions: north, south, east, west","Population density","A locator globe"], correct:1 },
  { type:"sa", q:"What is the purpose of a locator globe on a map?", answer:"It shows the specific area of the world shown on the larger map.", alts:["shows where the map area is located on Earth","gives context of location","shows where on Earth the map is"] },
  { type:"mc", q:"Lines of latitude run:", options:["North to south, parallel to the prime meridian","East to west, parallel to the equator","Diagonally across the globe","Only through Greenwich, England"], correct:1 },
  { type:"sa", q:"What is the equator?", answer:"The center line of latitude (0 degrees), dividing Earth into Northern and Southern Hemispheres.", alts:["0 degrees latitude","the line that splits Earth into north and south halves","the imaginary line at 0 latitude"] },
  { type:"mc", q:"Lines of longitude run:", options:["East to west, parallel to the equator","North to south, from the North Pole to the South Pole","Only in the Southern Hemisphere","Diagonally"], correct:1 },
  { type:"sa", q:"What is the prime meridian, and what is its degree measurement?", answer:"The line of longitude (0 degrees) that runs through Greenwich, England.", alts:["0 degrees longitude","the starting line for longitude","zero degrees, through Greenwich England"] },
  { type:"mc", q:"A hemisphere is:", options:["A quarter of Earth","Half of Earth","A type of map projection","A line of latitude"], correct:1 },
  { type:"sa", q:"What line divides Earth into the Northern and Southern Hemispheres?", answer:"The equator", alts:["0 degrees latitude","equator"] },
  { type:"sa", q:"What line divides Earth into the Western and Eastern Hemispheres?", answer:"The prime meridian", alts:["0 degrees longitude","prime meridian"] },
  { type:"sa", q:"Berlin, Germany has an absolute location of 52\u00b0N, 13\u00b0E. What does this tell you about Berlin's position?", answer:"It is 52 degrees north of the equator and 13 degrees east of the prime meridian.", alts:["52 north 13 east","north of the equator and east of the prime meridian","52 degrees north and 13 degrees east"] },
  { type:"mc", q:"What does absolute location mean?", options:["A general description like \"near the coast\"","The exact point where a place is located, using latitude and longitude","The distance between two cities","A country's population"], correct:1 },
  { type:"mc", q:"A large-scale map:", options:["Covers a large area but shows few details","Covers a small area but shows many details","Always shows the whole world","Never has a legend"], correct:1 },
  { type:"mc", q:"A small-scale map:", options:["Covers a small area with many details","Covers a large area but shows fewer details","Only shows cities","Has no scale bar"], correct:1 },
  { type:"sa", q:"Give an example of when you would use a large-scale map versus a small-scale map.", answer:"Large-scale for a small, detailed area (like a city); small-scale for a large area (like several states or a coastline).", alts:["large scale for small detailed area small scale for large area","large scale city small scale multiple states","large-scale for detail small-scale for big area"] },
  { type:"mc", q:"A political map shows:", options:["Elevation and landforms","Features humans have created, like countries, states, and cities","Only oceans and rivers","Weather patterns"], correct:1 },
  { type:"mc", q:"A physical map shows:", options:["Country borders only","Natural features like mountains, plains, valleys, deserts, and bodies of water","Population density","Voting districts"], correct:1 },
  { type:"sa", q:"What is elevation?", answer:"The height of a physical feature above sea level.", alts:["how high something is above sea level","height above sea level"] },
  { type:"sa", q:"What is relief?", answer:"The change in elevation from one place to another.", alts:["difference in height between places","change in elevation from place to place"] },
  { type:"mc", q:"A cartographer is:", options:["A person who studies weather","A mapmaker","A geologist","A ship navigator"], correct:1 },
  { type:"sa", q:"Why do cartographers use map projections?", answer:"To show Earth's curved surface on a flat map, reducing distortion.", alts:["because earth is round but maps are flat","to make the globe fit on paper","to reduce distortion when flattening the globe"] },
  { type:"mc", q:"Which map projection shows direction accurately and is commonly used for navigation, but distorts the size/shape of land near the poles?", options:["Robinson","Mercator","Homolosine","Azimuthal"], correct:1 },
  { type:"mc", q:"Which projection resembles the flattened peel of an orange and shows land shapes/areas accurately, but not distances?", options:["Winkel Tripel","Mercator","Homolosine","Azimuthal"], correct:2 }
];

let score = 0;
let answered = new Array(questions.length).fill(false);

function normalize(str) {
  return str.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
}

function updateScore() {
  document.getElementById("scoreBar").textContent = "Score: " + score + " / " + questions.length;
}

function renderQuiz() {
  const container = document.getElementById("quiz");
  container.innerHTML = "";
  questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "question";
    div.id = "q" + i;

    let inner = `<div class="qnum">Question ${i + 1} of ${questions.length}</div>
                 <div class="qtext">${q.q}</div>`;

    if (q.type === "mc") {
      inner += `<div class="options" id="opts${i}">`;
      q.options.forEach((opt, oi) => {
        inner += `<div class="option" onclick="answerMC(${i}, ${oi})">${opt}</div>`;
      });
      inner += `</div><div class="feedback" id="fb${i}"></div>`;
    } else {
      inner += `<input type="text" id="input${i}" placeholder="Type your answer here...">
                 <button class="check-btn" id="btn${i}" onclick="answerSA(${i})">Check</button>
                 <div class="feedback" id="fb${i}"></div>`;
    }

    div.innerHTML = inner;
    container.appendChild(div);
  });
}

function answerMC(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;
  const q = questions[qi];
  const opts = document.querySelectorAll(`#opts${qi} .option`);
  opts.forEach(o => o.classList.add("disabled"));

  const fb = document.getElementById("fb" + qi);
  if (oi === q.correct) {
    opts[oi].classList.add("correct");
    fb.innerHTML = "&#9989; Correct!";
    fb.className = "feedback correct-text";
    score++;
  } else {
    opts[oi].classList.add("incorrect");
    opts[q.correct].classList.add("correct");
    fb.innerHTML = "&#10060; Not quite. The correct answer is highlighted above.";
    fb.className = "feedback wrong-text";
  }
  updateScore();
}

function answerSA(qi) {
  if (answered[qi]) return;
  const q = questions[qi];
  const inputEl = document.getElementById("input" + qi);
  const userVal = normalize(inputEl.value);
  if (!userVal) return;

  answered[qi] = true;
  inputEl.disabled = true;
  document.getElementById("btn" + qi).disabled = true;

  const acceptable = [q.answer, ...(q.alts || [])].map(normalize);
  const isMatch = acceptable.includes(userVal);

  const fb = document.getElementById("fb" + qi);
  if (isMatch) {
    fb.innerHTML = "&#9989; Correct!";
    fb.className = "feedback correct-text";
    score++;
  } else {
    fb.innerHTML = `Here's the answer to compare:
      <div class="compare-box">${q.answer}</div>
      <span style="font-weight:normal; font-size:0.9em; color:#667;">(If your answer means the same thing in different words, that's okay!)</span>`;
    fb.className = "feedback";
  }
  updateScore();
}

function resetQuiz() {
  score = 0;
  answered = new Array(questions.length).fill(false);
  updateScore();
  renderQuiz();
  window.scrollTo({top: 0, behavior: "smooth"});
}

document.getElementById("resetBtn").addEventListener("click", resetQuiz);
document.getElementById("resetBtnTop").addEventListener("click", resetQuiz);

document.getElementById("shareBtn").addEventListener("click", async () => {
  const shareData = {
    title: document.title,
    text: "Check out this Geography Study Quiz!",
    url: window.location.href
  };
  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      // User canceled the share sheet or it failed silently — no action needed.
    }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(window.location.href);
      const toast = document.getElementById("shareToast");
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    } catch (err) {
      alert("Copy this link to share: " + window.location.href);
    }
  } else {
    alert("Copy this link to share: " + window.location.href);
  }
});

renderQuiz();
updateScore();
</script>
</body>
</html>
